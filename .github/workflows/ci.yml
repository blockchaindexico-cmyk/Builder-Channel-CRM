# Continuous integration (M01-26): lint, format, types, dependency audit, unit + integration tests, build,
# and end-to-end tests against real PostgreSQL, S3 (RustFS) and SMTP (Mailpit) services.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://crm:crm@localhost:5432/crm
  TEST_DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_test
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://localhost:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_BUCKET: crm-files
  S3_ACCESS_KEY_ID: crm-access-key
  S3_SECRET_ACCESS_KEY: crm-secret-key
  S3_FORCE_PATH_STYLE: "true"
  EMAIL_TRANSPORT: smtp
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm" --health-interval 5s --health-timeout 5s --health-retries 10
      storage:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: crm-access-key
          RUSTFS_SECRET_KEY: crm-secret-key
        ports: ["9000:9000"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: PGPASSWORD=crm psql -h localhost -U crm -d crm -c "CREATE DATABASE crm_test"
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Dependency audit (high and critical)
        run: pnpm audit --prod --audit-level=high
      - run: pnpm test
      - run: pnpm build
        env:
          NODE_ENV: production

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm -d crm" --health-interval 5s --health-timeout 5s --health-retries 10
      storage:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: crm-access-key
          RUSTFS_SECRET_KEY: crm-secret-key
        ports: ["9000:9000"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          E2E_SERVER_COMMAND: pnpm exec concurrently -k "pnpm start" "pnpm worker"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          tags: crm-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          tags: crm-worker:ci
          cache-from: type=gha
      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          tags: crm-migrate:ci
          cache-from: type=gha
